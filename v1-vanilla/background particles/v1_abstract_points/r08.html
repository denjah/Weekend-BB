<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>body { margin: 0; overflow: hidden; background: transparent; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';

        const COUNT = 3000;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100;
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(COUNT * 3);
        const basePositions = new Float32Array(COUNT * 3);
        const phases = new Float32Array(COUNT);

        
        for(let i=0; i<COUNT; i++) {
            const pZ = (Math.floor(Math.random()*5)-2)*30;
            basePositions[i*3] = (Math.random()-0.5)*200;
            basePositions[i*3+1] = (Math.random()-0.5)*200;
            basePositions[i*3+2] = pZ;
            phases[i] = Math.random() * Math.PI * 2;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(16,16,0, 16,16,16);
        gradient.addColorStop(0, 'rgba(0,119,182,1)');
        gradient.addColorStop(1, 'rgba(0,119,182,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0,32,32);
        const texture = new THREE.CanvasTexture(canvas);

        const material = new THREE.PointsMaterial({
            size: 2.5,
            map: texture,
            transparent: true,
            opacity: 0.8,
            depthWrite: false,
            color: 0x0077B6
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        const clock = new THREE.Clock();
        let targetX = 0, targetY = 0;
        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth) * 2 - 1;
            targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        let mouseX = 0, mouseY = 0;

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            const pos = geometry.attributes.position.array;

            
        for(let i=0; i<COUNT; i++) {
            const ix = i*3, iy = i*3+1, iz = i*3+2;
            pos[ix] = basePositions[ix] + Math.sin(time*0.2 + phases[i])*2;
            pos[iy] = basePositions[iy] + Math.cos(time*0.2 + phases[i])*2;
            pos[iz] = basePositions[iz];
        }

            geometry.attributes.position.needsUpdate = true;
            
            camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 10 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
