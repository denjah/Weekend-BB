<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>body { margin: 0; overflow: hidden; background: transparent; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';

        const COUNT = 4000;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100;
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(COUNT * 3);
        const basePositions = new Float32Array(COUNT * 3);
        const phases = new Float32Array(COUNT);

        
        for(let i=0; i<COUNT; i++) {
            const r = 20 + Math.random() * 80;
            const a = Math.random() * Math.PI * 2;
            basePositions[i*3] = Math.cos(a) * r;
            basePositions[i*3+1] = Math.sin(a) * r;
            basePositions[i*3+2] = (Math.random()-0.5)*80;
            phases[i] = Math.random() * 0.2 + 0.05;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const vertexShader = `
        uniform float uTime;
        varying float vBlur;
        
        void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            
            // Depth from camera
            float dist = -mvPosition.z;
            // Focal point near 100
            float blur = clamp(abs(dist - 100.0) / 120.0, 0.0, 1.0);
            vBlur = blur;
            
            // Base size + bokeh expansion
            float baseSize = 6.0; 
            float size = baseSize + blur * 25.0;
            
            gl_PointSize = size * (100.0 / dist);
            gl_Position = projectionMatrix * mvPosition;
        }
        `;

        const fragmentShader = `
        varying float vBlur;
        
        void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;
            
            // Billiard sphere shading
            float z = sqrt(max(0.0, 0.25 - dist*dist)) * 2.0;
            vec3 normal = normalize(vec3(coord.x, -coord.y, z));
            
            vec3 lightDir = normalize(vec3(-1.0, 1.0, 1.0));
            float diff = max(0.0, dot(normal, lightDir));
            
            vec3 viewDir = vec3(0.0, 0.0, 1.0);
            vec3 halfDir = normalize(lightDir + viewDir);
            float spec = pow(max(0.0, dot(normal, halfDir)), 16.0);
            
            vec3 color = vec3(0.0, 0.46, 0.71); // #0077B6
            
            vec3 shaded = color * (0.4 + 0.6 * diff) + vec3(1.0) * spec * 0.4;
            vec3 finalColor = mix(shaded, color, vBlur);
            
            float edgeSoftness = mix(0.02, 0.5, vBlur);
            float alpha = smoothstep(0.5, 0.5 - edgeSoftness, dist);
            
            // Fade out the highly blurred particles
            alpha *= mix(0.95, 0.15, vBlur);
            
            gl_FragColor = vec4(finalColor, alpha);
        }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 }
            },
            transparent: true,
            depthWrite: false,
            blending: THREE.NormalBlending
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        const clock = new THREE.Clock();
        let targetX = 0, targetY = 0;
        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth) * 2 - 1;
            targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        let mouseX = 0, mouseY = 0;

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            material.uniforms.uTime.value = time;
            
            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            const pos = geometry.attributes.position.array;

            
        for(let i=0; i<COUNT; i++) {
            const ix = i*3, iy = i*3+1, iz = i*3+2;
            const a = time * phases[i];
            const bx = basePositions[ix], by = basePositions[iy];
            pos[ix] = bx * Math.cos(a) - by * Math.sin(a);
            pos[iy] = bx * Math.sin(a) + by * Math.cos(a);
            pos[iz] = basePositions[iz] + Math.sin(time*0.5 + phases[i])*10;
        }

            geometry.attributes.position.needsUpdate = true;
            
            camera.position.x += (mouseX * 15 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 15 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
